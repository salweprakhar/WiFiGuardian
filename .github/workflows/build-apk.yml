
name: Build WiFi Guardian APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/live-traffic-monitoring

jobs:
  build:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: ./android

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Verify Android project structure
        working-directory: .
        run: |
          echo "Repository files:"
          ls -la

          echo "Android project files:"
          ls -la android/

          test -f android/settings.gradle.kts || \
          test -f android/settings.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          java -version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Verify generated APK
        run: |
          find app/build/outputs/apk -name "*.apk"

      - name: Upload WiFi Guardian APK
        uses: actions/upload-artifact@v4
        with:
          name: WiFiGuardian-v06-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
